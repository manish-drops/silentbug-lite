[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "silentbug-lite"
version = "0.1.0"
description = "Five checks for bugs that tests and linters miss, in Python and JavaScript/TypeScript: errors that still return success, SQL injection, secrets in code, routes with no login check and LLM calls in loops."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["static-analysis", "security", "sarif", "fastapi", "express", "nextjs", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "tree-sitter>=0.25",
    "tree-sitter-javascript>=0.25",
    "tree-sitter-typescript>=0.23",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "jsonschema>=4.0"]

[project.scripts]
silentbug-lite = "silentbug_lite.cli:main"

[tool.setuptools.packages.find]
include = ["silentbug_lite*"]

[tool.setuptools.package-data]
silentbug_lite = ["data/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["examples"]  # bugs planted on purpose

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Code samples inside test strings read better unwrapped.
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
